name: tscircuit Snapshot

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tscircuit-snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check circuits
        run: bun run typecheck

      - name: Check PCB and schematic snapshots
        run: bun run snapshot

      - name: Verify snapshots are committed
        shell: bash
        run: |
          snapshot_status="$(git status --porcelain --untracked-files=all -- '**/__snapshots__/*.snap.*')"
          if [[ -n "$snapshot_status" ]]; then
            echo "$snapshot_status"
            echo "Snapshot files changed; run 'bun run snapshot:update' and commit them."
            exit 1
          fi

      - name: Upload snapshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tscircuit-snapshot-diffs
          path: "**/__snapshots__/*.diff.*"
          if-no-files-found: ignore
          retention-days: 7
