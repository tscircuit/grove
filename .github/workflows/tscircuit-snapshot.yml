name: tscircuit Snapshot

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tscircuit-snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check circuits
        run: bun run typecheck

      - name: Check per-board design reviews
        run: bun run review:check

      - name: Check PCB and schematic snapshots
        run: bun run snapshot

      - name: Check JLCPCB supplier and footprint selections
        run: bun run jlcpcb:check

      - name: Verify deterministic snapshots are committed
        shell: bash
        run: |
          snapshot_status="$(git status --porcelain --untracked-files=all -- '**/__snapshots__/*.snap.svg')"
          schematic_status="$(printf '%s\n' "$snapshot_status" | grep -- '-schematic.snap.svg' || true)"
          pcb_status="$(printf '%s\n' "$snapshot_status" | grep -- '-pcb.snap.svg' || true)"
          if [[ -n "$schematic_status" ]]; then
            echo "$schematic_status"
            echo "Schematic snapshot files changed; run 'bun run snapshot:update' and commit them."
            exit 1
          fi
          if [[ -n "$pcb_status" ]]; then
            echo "$pcb_status"
            echo "PCB snapshots were regenerated. Route geometry may vary across renderer platforms; all expected PCB files were presence-checked by snapshot:check."
          fi

      - name: Upload generated snapshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tscircuit-snapshot-output
          path: "**/__snapshots__/*.snap.*"
          if-no-files-found: ignore
          retention-days: 7
